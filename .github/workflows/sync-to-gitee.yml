name: Sync to Gitee Mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 必须拉完整历史否则 push 会被拒
          persist-credentials: false

      - name: Push to Gitee
        env:
          GITEE_USER: theathond
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: theathond/mediversity-web-v2
        run: |
          set -e
          if [ -z "$GITEE_TOKEN" ]; then
            echo "❌ Missing GITEE_TOKEN secret"
            exit 1
          fi

          GITEE_URL="https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"

          git remote add gitee "$GITEE_URL"
          git push gitee main --force

          echo "✅ Synced to Gitee: $(git rev-parse --short HEAD)"
